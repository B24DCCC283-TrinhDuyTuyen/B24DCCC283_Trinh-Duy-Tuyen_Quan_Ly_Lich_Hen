plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.appointmentmanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.appointmentmanager'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        viewBinding false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}


// Đồng bộ Kotlin dependencies để tránh Duplicate class giữa các phiên bản stdlib.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion '1.8.22'
            details.because 'Keep all Kotlin runtime artifacts on the same version'
        }
    }
}
